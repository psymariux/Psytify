version: 2

updates:
  # Dependencies of the desktop client (root workspace).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Iced 0.13, winit and the video player must be upgraded together and by hand: the Android app uses a
      # patched copy of iced_winit (android/vendor).
      - dependency-name: "iced"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "iced_*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "winit"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The Android shell is a separate workspace, with its own Cargo.lock.
  - package-ecosystem: cargo
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    labels: [dependencies, rust, android]
    commit-message:
      prefix: "deps(android)"
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "iced"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "iced_*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "winit"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions are pinned to a SHA: Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
