version: 2

updates:
  # Dependencies of the desktop client (root workspace).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The desktop is on gstreamer 0.25: move it by hand.
      - dependency-name: "gstreamer*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions are pinned to a SHA: Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
