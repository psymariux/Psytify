# Etichette automatiche per percorso (actions/labeler).
client:
  - changed-files:
      - any-glob-to-any-file: ["client/src/**", "client/tests/**", "client/Cargo.toml"]
ui:
  - changed-files:
      - any-glob-to-any-file: ["client/src/ui/**", "client/assets/**", "docs/STYLE.md"]
audio:
  - changed-files:
      - any-glob-to-any-file: ["client/src/player/**"]
android:
  - changed-files:
      - any-glob-to-any-file: ["android/**", "scripts/android-*", "docs/ANDROID.md"]
packaging:
  - changed-files:
      - any-glob-to-any-file: ["client/PKGBUILD", "client/psytify.desktop", "scripts/arch-package.sh"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["Cargo.lock", "android/Cargo.lock", "deny.toml"]
