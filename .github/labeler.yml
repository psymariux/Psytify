# Automatic labels by path (actions/labeler).
desktop:
  - changed-files:
      - any-glob-to-any-file: ["desktop/src/**", "desktop/Cargo.toml"]
mobile:
  - changed-files:
      - any-glob-to-any-file: ["mobile/**"]
core:
  - changed-files:
      - any-glob-to-any-file: ["core/src/**", "core/tests/**", "core/Cargo.toml"]
design:
  - changed-files:
      - any-glob-to-any-file: ["design/**", "docs/design/**"]
ui:
  - changed-files:
      - any-glob-to-any-file: ["desktop/src/**", "android-app/**", "design/assets/**", "docs/STYLE.md"]
audio:
  - changed-files:
      - any-glob-to-any-file: ["core/src/player/**"]
android:
  - changed-files:
      - any-glob-to-any-file: ["android-app/**", "mobile/**", "scripts/android-*", "docs/ANDROID.md"]
packaging:
  - changed-files:
      - any-glob-to-any-file: ["desktop/PKGBUILD", "desktop/psytify.desktop", "scripts/arch-package.sh"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["Cargo.lock", "deny.toml"]
