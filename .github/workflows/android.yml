name: Android

# Compila e firma l'APK. Gira a mano, sulle modifiche ad Android e come parte della release.
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "scripts/android-*"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            android -> android/target
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Locate the NDK 27 of the runner
        run: |
          ndk=$(ls "$ANDROID_HOME/ndk" | grep '^27\.' | sort -V | tail -1)
          echo "NDK_VERSION=$ndk" >> "$GITHUB_ENV"
          echo "using NDK $ndk"
      # Senza segreti l'APK si firma con una chiave nuova: va bene per provarlo, ma un aggiornamento
      # non si installa sopra una versione firmata con un'altra chiave.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/psytify-release.keystore"
            printf '%s' "$KEYSTORE_PASS" > "$HOME/.android/psytify-release.pass"
            echo "signing with the configured release key"
          else
            echo "::warning::No signing key configured: the APK is signed with a throwaway key."
          fi
      - name: Build the APK
        env:
          # Facoltativo: il backend che l'app usa di default (variabile del repository, non un segreto).
          PSYTIFY_DEFAULT_API_URL: ${{ vars.PSYTIFY_DEFAULT_API_URL }}
        run: scripts/android-apk.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psytify-apk
          path: android/target/release/apk/psytify.apk
          if-no-files-found: error
          retention-days: 14
