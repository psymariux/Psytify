name: Release

# Si lancia con un tag `vX.Y.Z`: compila Linux, Windows, pacchetto Arch e APK, poi pubblica la release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        env:
          PSYTIFY_DEFAULT_API_URL: ${{ vars.PSYTIFY_DEFAULT_API_URL }}
        run: cargo build -p psytify --release --locked
      - name: Package
        run: |
          name="psytify-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/psytify README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: psytify-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows binary
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (without video clips: the runner has no GStreamer)
        env:
          PSYTIFY_DEFAULT_API_URL: ${{ vars.PSYTIFY_DEFAULT_API_URL }}
        run: cargo build -p psytify --release --locked --no-default-features
      - name: Package
        shell: pwsh
        run: |
          $name = "psytify-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/psytify.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: psytify-*.zip
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare the build user (makepkg refuses to run as root)
        run: |
          pacman -Syu --noconfirm git rustup sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package
        env:
          PSYTIFY_DEFAULT_API_URL: ${{ vars.PSYTIFY_DEFAULT_API_URL }}
        run: |
          chown -R builder:builder .
          su builder -c 'rustup default stable && CHECK=0 scripts/arch-package.sh'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: dist/arch/*.pkg.tar.zst
          if-no-files-found: error

  android:
    name: Android APK
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: [linux, windows, arch, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Name the APK after the release and write checksums
        run: |
          cd dist
          mv psytify.apk "psytify-${GITHUB_REF_NAME}-android.apk"
          sha256sum * > SHA256SUMS
          ls -la
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
