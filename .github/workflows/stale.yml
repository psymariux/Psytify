name: Stale

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,help wanted"
          exempt-pr-labels: "pinned,security,dependencies"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless there is
            new activity.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will be closed in 14 days unless
            there is new activity.
