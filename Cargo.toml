[workspace]
members = ["client"]
# Android is a separate workspace: it uses a patched copy of iced_winit (see android/vendor).
exclude = ["android"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "AGPL-3.0-only"
repository = "https://github.com/psymariux/Psytify"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Distribution build. Full LTO and a single codegen unit: the optimizer sees the whole
# program together (dependencies included) and can inline across crates. It costs build time,
# not run time. `panic` stays `unwind`: a panic in a task must not close the player.
# Before/after measurements in docs/PERFORMANCE.md ("Release profile").
[profile.release]
lto = "fat"
codegen-units = 1
