[workspace]
members = ["core", "design", "desktop", "mobile", "mobile/gen"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "AGPL-3.0-only"
repository = "https://github.com/psymariux/Psytify"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Distribution build. Full LTO and a single codegen unit: the optimizer sees the whole
# program together (dependencies included) and can inline across crates. It costs build time,
# not run time. `panic` stays `unwind`: a panic in a task must not close the player.
# Before/after measurements in docs/PERFORMANCE.md ("Release profile").
[profile.release]
lto = "fat"
codegen-units = 1

# The Kotlin app's emulator builds (`QUICK=1 scripts/android-kotlin.sh`): release code without the
# whole-program LTO, a few minutes faster, in its own directory under `target/`.
[profile.android-quick]
inherits = "release"
lto = false
codegen-units = 16
