[workspace]
members = ["client"]
# Android è un workspace a parte: usa una copia patchata di iced_winit (vedi android/vendor).
exclude = ["android"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "AGPL-3.0-only"
repository = "https://github.com/psymariux/Psytify"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Build di distribuzione. LTO completo e una sola unità di codegen: l'ottimizzatore vede tutto il
# programma insieme (dipendenze comprese) e può fare inline fra crate. Costa tempo di compilazione,
# non di esecuzione. `panic` resta `unwind`: un panic in un task non deve chiudere il player.
# Misure prima/dopo in docs/PERFORMANCE.md («Profilo di release»).
[profile.release]
lto = "fat"
codegen-units = 1
