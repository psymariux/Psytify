# Psytify for Android: a thin shell that starts the client library (`../client`) with
# the phone layout. It is a separate workspace (excluded from the root one) because it uses
# a patched copy of `iced_winit` (see vendor/README.md) that the desktop must not see.
#
# Build the APK: scripts/android-apk.sh (NDK 27, cargo-apk). See docs/ANDROID.md.

# Its own workspace: `cargo-apk` does not read the root's `exclude`.
[workspace]

[package]
name = "psytify-android"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
# Android loads the app as a native library (`libpsytify_android.so`) and calls `android_main`.
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The whole app. Without the default features: video clips use GStreamer, which Android lacks.
psytify = { path = "../client", default-features = false }
# NativeActivity: the system `Activity` that loads a native library, with no Java code.
winit = { version = "0.30", features = ["android-native-activity"] }
# The same version Iced already uses: needed here for the patch's `ANDROID_APP`.
iced_winit = "0.13"
# The app's logs (`log::warn!`) go to logcat instead of nowhere.
android_logger = "0.14"
# To ask Android where the system bars are (src/insets.rs). It is the version
# audio (oboe) already brings in: no new crate to compile.
jni = "0.21"
log = "0.4"

[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }

[profile.release]
lto = "fat"
codegen-units = 1

[package.metadata.android]
package = "dev.psytify.app"
apk_name = "psytify"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Le icone dell'app (mipmap) stanno qui.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# La notifica dei comandi multimediali (schermata di blocco): da Android 13 si chiede a runtime
# (`PsytifyMedia.start`).
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
label = "Psytify"
icon = "@mipmap/ic_launcher"
# A development backend speaks HTTP on the local network; in production the backend is HTTPS.
uses_cleartext_traffic = true
# Il codice Java (`classes.dex`, la sessione multimediale): senza `hasCode`, Android non carica il dex.
has_code = true

[package.metadata.android.application.activity]
# Every declarable configuration change: without them, Android recreates the activity and a
# Rust NativeActivity hangs (onDestroy waits for an `android_main` that never returns). The two bits the SDK does not
# accept by name are added by scripts/android-manifest.py.
config_changes = "mcc|mnc|locale|touchscreen|keyboard|keyboardHidden|navigation|orientation|screenLayout|uiMode|screenSize|smallestScreenSize|density|layoutDirection|colorMode|grammaticalGender|fontWeightAdjustment|fontScale"
orientation = "portrait"
