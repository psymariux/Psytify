# Psytify per Android: un guscio sottile che avvia la libreria del client (`../client`) con
# l'impaginazione da telefono. È un workspace a parte (escluso da quello della radice) perché usa
# una copia patchata di `iced_winit` (vedi vendor/README.md) che il desktop non deve vedere.
#
# Compilare l'APK: scripts/android-apk.sh (NDK 27, cargo-apk). Vedi docs/ANDROID.md.

# Workspace proprio: `cargo-apk` non legge l'`exclude` della radice.
[workspace]

[package]
name = "psytify-android"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
# Android carica l'app come libreria nativa (`libpsytify_android.so`) e chiama `android_main`.
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Tutta l'app. Senza le feature di default: il videoclip usa GStreamer, che su Android non c'è.
psytify = { path = "../client", default-features = false }
# NativeActivity: la `Activity` di sistema che carica una libreria nativa, senza codice Java.
winit = { version = "0.30", features = ["android-native-activity"] }
# La stessa versione che Iced usa già: qui serve per `ANDROID_APP` della patch.
iced_winit = "0.13"
# I log dell'app (`log::warn!`) finiscono in logcat invece che nel vuoto.
android_logger = "0.14"
# Per chiedere ad Android dove stanno le barre del sistema (src/insets.rs). È la versione che
# l'audio (oboe) porta già: nessuna crate nuova da compilare.
jni = "0.21"
log = "0.4"

[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }

[profile.release]
lto = "fat"
codegen-units = 1

[package.metadata.android]
package = "dev.psytify.app"
apk_name = "psytify"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Le icone dell'app (mipmap) stanno qui.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Psytify"
icon = "@mipmap/ic_launcher"
# Il backend di sviluppo parla HTTP sulla rete locale; in produzione il backend è HTTPS.
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
# Ogni cambio di configurazione dichiarabile: senza, Android ricrea l'activity e una NativeActivity
# in Rust si blocca (onDestroy aspetta un `android_main` che non finisce). I due bit che l'SDK non
# accetta per nome li aggiunge scripts/android-manifest.py.
config_changes = "mcc|mnc|locale|touchscreen|keyboard|keyboardHidden|navigation|orientation|screenLayout|uiMode|screenSize|smallestScreenSize|density|layoutDirection|colorMode|grammaticalGender|fontWeightAdjustment|fontScale"
orientation = "portrait"
