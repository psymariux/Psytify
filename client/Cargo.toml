[package]
# Since step 7 the desktop is GPUI (`desktop/`, package and binary `psytify`): this crate stays the Iced
# app, which the Android phone starts as a library (`android/`, renamed `psytify` through `package =`).
# The `psytify-iced` binary is for development only: the same app on the desktop (`PSYTIFY_PHONE=1` tries the
# phone layout).
name = "psytify-iced"
version = "0.1.0"
description = "Psytify on Iced: the Android phone app and the psytify-iced development binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The library holds the whole app: the development binary (`main.rs`) and the Android crate (`android/`)
# start it with their own window.
[lib]
name = "psytify_iced"
path = "src/lib.rs"

[[bin]]
name = "psytify-iced"
path = "src/main.rs"

[dependencies]
# The logic without UI (API, playback, configuration): shared by the frontends. Without the
# default features: the API side of video clips is switched on by the `video` feature below.
psytify-core = { path = "../core", default-features = false }
# Token del design (palette, misure, tipi) e sprite pixel art come dati semplici: `ui/theme.rs` li
# converts them to Iced types and `ui/icons.rs` scales the sprites on the CPU. A workspace crate, already
# used by the GPUI frontend: no new external dependency (`image` and `serde` are already in the graph).
psytify-design = { path = "../design" }
# GUI: wgpu with the tiny-skia software fallback; tokio as the executor for Task::perform and time::every;
# svg for the icons; lazy for `responsive`, which gives the view the real window width;
# image-without-codecs for covers (the core decodes them: its own `image` chooses the codecs).
# Without the default features: the Fira Sans font is not needed (we use Inter) and system
# theme detection (zbus on Linux) is not either, because the theme is fixed.
iced = { version = "0.13.1", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "svg", "lazy", "image-without-codecs", "advanced"] }
# The guided tour (`PSYTIFY_TOUR`) saves the screens as PNG. Covers are decoded by the core
# (`psytify_core::artwork`); Iced keeps its own `image` 0.24, which only receives ready-made RGBA pixels.
image = { version = "0.25", default-features = false, features = ["png"] }
# UI waits (search debounce, notices, hover), blocking work off the UI thread
# (`spawn_blocking`) and the updates folder. `sync`: the core snapshots
# (`watch`) become messages; in tests, the channels.
tokio = { version = "1", features = ["time", "fs", "rt", "sync"] }
# `stream::unfold` for the subscription to the core's snapshots (and `StreamExt` in tests). The jam's
# tracks are no longer requested from here: the core asks for them (step 4.8).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Catalog identifiers: an invalid id never ends up in a URL path.
uuid = { version = "1", features = ["v4", "serde"] }
# This interface's preferences inside `config.json` (`UiPrefs`: last screen, panel):
# the core saves them as JSON without knowing them. Already in the graph with the core, no new crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System random bytes: the digits added to the suggested username if it is already taken.
getrandom = "0.4"
# Video clips inside the app with GStreamer: 0.5 is the last for Iced 0.13 and decodes only the video,
# so the audio stays the player's. `url` is the type the widget accepts.
iced_video_player = { version = "0.5", optional = true }
# The same GStreamer as iced_video_player (already compiled): it is only used to lower the rank of the
# NVIDIA decoders, which on hybrid laptops would wake the discrete GPU for a video clip.
gstreamer = { version = "0.22", optional = true }
url = { version = "2", optional = true }

[features]
# Without `video` the client builds even where GStreamer is missing: the video clip button disappears.
default = ["video"]
video = ["psytify-core/video", "dep:iced_video_player", "dep:url", "dep:gstreamer"]
# Automatic tour of the views with screenshots (`PSYTIFY_TOUR`): only used to check the UI.
tour = []

[dev-dependencies]
# The test helpers that live in the core (`test-support`): test tracks, detached audio output,
# network-less jam. In a real build the feature stays off.
psytify-core = { path = "../core", default-features = false, features = ["test-support"] }
# The characterization tests read the samples from the detached output (`MixerSource`): the same
# version as the core, no new crate.
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# `test-util`: the characterization tests pause tokio's clock (`start_paused`), so the app's
# waits (search debounce, pause after a "too many requests", notices) pass at once
# and deterministically.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
# `task::into_stream`: the tests run the `Task`s returned by `update` outside the window and
# collect their messages. It is the runtime iced already builds, at the same version: no new crate
# in the graph, only for tests.
iced_runtime = "0.13"

[lints]
workspace = true
