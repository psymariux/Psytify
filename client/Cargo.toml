[package]
name = "psytify"
version = "0.1.0"
description = "Desktop music player for Psytify catalogs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The library holds the whole app: the desktop binary (`main.rs`) and the Android crate (`android/`)
# start it with their own window.
[lib]
name = "psytify"
path = "src/lib.rs"

[[bin]]
name = "psytify"
path = "src/main.rs"

[dependencies]
# GUI: wgpu with the tiny-skia software fallback; tokio as the executor for Task::perform and time::every;
# svg for the icons; lazy for `responsive`, which gives the view the real window width;
# image-without-codecs for covers (the codecs are chosen by the `image` dependency below).
# Without the default features: the Fira Sans font is not needed (we use Inter) and system
# theme detection (zbus on Linux) is not either, because the theme is fixed.
iced = { version = "0.13.1", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "svg", "lazy", "image-without-codecs"] }
# Internet Archive covers: `image` 0.25 with only the codecs of the item images (JPEG, PNG,
# GIF, WebP). Iced keeps its own `image` 0.24, which only handles ready-made RGBA pixels here.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Audio: output device and Player. The decoding is ours (symphonia below), so rodio needs only playback.
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# Direct decoding of every format: rodio 0.20's decoder does not tell Symphonia the stream
# length, so seeking in FLAC failed and M4A files did not open (see `player::decoder`).
# It is already in the graph as a rodio dependency. To the symphonia-all formats we add the
# `ogg` container (symphonia-format-ogg), without which the `.ogg` files served by the backend did not open.
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
# HTTP to the backend: TLS with rustls, no dependency on the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Search debounce and asynchronous writing of configuration and downloads. `net`: the Clerk
# sign-in receives the OAuth code on a loopback port (127.0.0.1). `rt`, `sync` and `macros`: the
# jam runs on its own runtime, with a command channel and `select!` on the socket.
tokio = { version = "1", features = ["time", "fs", "io-util", "net", "rt", "sync", "macros"] }
# Jam: the WebSocket client towards the backend. TLS with rustls and the Mozilla roots
# (`wss://` in production), like reqwest.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# `SinkExt` and `StreamExt` to read and write on the jam socket.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The user's configuration and download directories on Windows and Linux.
dirs = "7"
# Catalog identifiers: an invalid id never ends up in a URL path.
uuid = { version = "1", features = ["v4", "serde"] }
# Clerk sign-in (OAuth 2.0 + PKCE): SHA-256 for the code challenge, system random bytes for
# verifier and state, opening the login page in the default browser (xdg-open, ShellExecute).
sha2 = "0.10"
getrandom = "0.3"
open = "5"
# Video clips inside the app with GStreamer: 0.5 is the last for Iced 0.13 and decodes only the video,
# so the audio stays the player's. `url` is the type the widget accepts.
iced_video_player = { version = "0.5", optional = true }
# The same GStreamer as iced_video_player (already compiled): it is only used to lower the rank of the
# NVIDIA decoders, which on hybrid laptops would wake the discrete GPU for a video clip.
gstreamer = { version = "0.22", optional = true }
url = { version = "2", optional = true }

# System media controls on Linux (MPRIS): media keys, desktop widgets,
# headphones. `use_zbus` speaks D-Bus in pure Rust: no libdbus to install.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[features]
# Without `video` the client builds even where GStreamer is missing: the video clip button disappears.
default = ["video"]
video = ["dep:iced_video_player", "dep:url", "dep:gstreamer"]
# Automatic tour of the views with screenshots (`PSYTIFY_TOUR`): only used to check the UI.
tour = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
