# cargo deny check: licences, advisories, dependency sources.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained direct dependencies block the CI; transitive ones stay visible in
# `cargo audit` and are tracked by Dependabot.
unmaintained = "workspace"
ignore = [
    # chrono is declared unmaintained (all versions, no update possible): the server uses it for
    # sqlx timestamps and serialisation, and GPUI brings it too. No known vulnerability; replacing
    # it with `time` or `jiff` is in the BACKLOG (needs sqlx and the server). Remove it from here
    # when that migration is done.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# The apps themselves and their crates (core, design, mobile).
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "psytify" },
    { allow = ["AGPL-3.0-only"], crate = "psytify-core" },
    { allow = ["AGPL-3.0-only"], crate = "psytify-design" },
    { allow = ["AGPL-3.0-only"], crate = "psytify-mobile" },
    { allow = ["AGPL-3.0-only"], crate = "psytify-mobile-gen" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI is pinned to Zed's git repository (owner's decision, 2026-11-22). Its `Cargo.toml` also pins
# to a revision the forks and unpublished crates it needs (wgpu for the renderer, font-kit, oo7,
# wasm_thread, xim-rs): these are the only other git sources allowed, one by one, with the revision
# in `Cargo.lock`. Every other git dependency stays forbidden by `unknown-git`.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs",
]
