# cargo deny check: licenses, advisories and sources of the dependencies.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained direct dependencies block CI; transitive ones (Iced 0.13's text stack:
# rustybuzz, ttf-parser, instant, paste) stay visible in `cargo audit` and are
# tracked by Dependabot. They go away only with an Iced upgrade.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# The client itself.
exceptions = [{ allow = ["AGPL-3.0-only"], crate = "psytify" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
