[package]
name = "psytify-design"
version = "0.2.0"
description = "Token del design di Psytify (colori, spazi, raggi, tipografia) e sprite pixel art come dati semplici"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Decodes the indexed PNGs of the sprites (`design/assets/pixel/export/1x`). Same version and
# same `png` feature the client already uses for covers (`image` 0.25), but without the other
# codecs: no new crate in the graph, only the `psytify-design -> image` edge in `Cargo.lock`.
image = { version = "0.25", default-features = false, features = ["png"] }
# Reads `sprites.json` (frame sizes, durations, palette) generated by `tools/sprites.py`.
# Already in the graph (client and server); here only the `Deserialize` derive is needed.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
