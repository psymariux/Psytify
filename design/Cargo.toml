[package]
name = "psytify-design"
version = "0.1.0"
description = "Psytify design tokens (colors, spacing, radii, typography) and pixel art sprites as plain data"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Decoding of the indexed sprite PNGs (`design/assets/pixel/export/1x`). Same version and
# same `png` feature the client already uses for covers (`image` 0.25), but without the other
# codecs: no new crate in the graph, only the `psytify-design -> image` edge in `Cargo.lock`.
image = { version = "0.25", default-features = false, features = ["png"] }
# Reading `sprites.json` (frame sizes, durations, palette) generated by `tools/sprites.py`.
# Already in the graph (client and backend); only the `Deserialize` derive is needed here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
