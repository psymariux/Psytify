# Psytify pixel sprites: manifest (source of truth together with src/**/*.txt).
# Compile with: python3 -I design/tools/sprites.py   (lint only: --check)
# Rules: docs/design/PSYTIFY_PIXEL_ART_GUIDELINES.md. Token values mirror
# docs/design/PSYTIFY_DESIGN_TOKENS.md and must change together with it.

version = 1
ap_dp = 2          # 1 art pixel = 2 dp at every scale (device px per AP is quantised)
max_colors = 15    # per sprite, transparency excluded (4bpp discipline)

[tokens]
deep_black  = "#000000"
near_black  = "#0e0d0c"
graphite    = "#1a1917"
charcoal    = "#2a2826"
iron        = "#3d3a37"
stone       = "#78746d"
medium_grey = "#9a958d"
soft_grey   = "#bdb8af"
warm_white  = "#ece8e0"
pure_white  = "#ffffff"
lime        = "#c6f24e"
error       = "#ff6b5e"

# Icons are 1-bit masks: the frontend tints index 1 with a token per state.
[palettes.mask]
"." = "transparent"
"#" = "tint"

# Mascot, illustration, placeholder: fixed greys, lime only for the "playing" LED.
[palettes.mascot]
"." = "transparent"
"o" = "near_black"
"k" = "graphite"
"c" = "charcoal"
"i" = "iron"
"s" = "stone"
"m" = "medium_grey"
"g" = "soft_grey"
"w" = "warm_white"
"p" = "pure_white"
"l" = "lime"

# Loader: four value steps, no lime (loading is not a playback state).
[palettes.ramp]
"." = "transparent"
"i" = "iron"
"m" = "medium_grey"
"g" = "soft_grey"
"w" = "warm_white"

