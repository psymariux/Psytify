[package]
# From step 7 this is the Psytify desktop: package and binary `psytify`, the one the PKGBUILD
# (`desktop/PKGBUILD`) and the releases install.
name = "psytify"
version = "0.2.0"
description = "Player musicale desktop per il catalogo Psytify (GPUI)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "psytify"
path = "src/main.rs"

[features]
default = ["video"]
# The music video (`src/video/`): the API side of the core (`VideoView`, `VideoCmd`, `Changed::video`) and the
# desktop GStreamer pipeline (BGRA frames into GPUI's atlas, `05-video-spike.md` option A).
# Needs GStreamer installed (libgstreamer1.0, base/good/libav plugins): it is not on Windows (`--no-default-features` in the `windows-desktop` job). On by default since step 7, as it
# was in the earlier client that the desktop replaces: at step 6.9 the memory goes up and the CPU goes to 720p and
# stays at the 360p limit (docs/PERFORMANCE.md, «Desktop passo 6.9»).
video = ["psytify-core/video", "dep:gstreamer", "dep:gstreamer-app"]
# GPUI's frame profile (`gpui::profiler`): time of each draw per phase (layout,
# prepaint, paint) and of each view, and of the delivery to the GPU. Only for measuring (`PSYTIFY_FRAME_STATS=SECONDI`,
# see `src/frame_stats.rs`): it costs a crate (`hdrhistogram`, used by GPUI's profile) and some CPU
# per frame, so the release binaries do not turn it on.
profile = ["gpui/profiler"]
# Test data for the social screens (`src/fixtures.rs`, `--fixture NAME`): a fake social view
# (sign-in half done, friends, profiles) in place of the core's, for screens without a real sign-in; with
# the test data the social commands do not start. No new dependency; off by default, never in the
# release binaries.
fixtures = []

[dependencies]
# The logic without UI: the desktop starts the core (`Core::start` with its own 2-thread runtime),
# sends it commands and reads its snapshots; there is no second audio engine, API client or playback
# state. Without the default features: the API side of the videos is switched on by the `video` feature
# above, together with the pipeline.
psytify-core = { path = "../core", default-features = false }
# Tokens, art pixel scale, sprite sheet and upscaled sprite cache: the visual identity
# shared with the phone. The desktop converts them to GPUI's types once (`theme`).
psytify-design = { path = "../design" }
# Zed's UI framework. Git only (the crates.io version is 13 months old and uses the Blade
# renderer); the rev is pinned on purpose and updated by hand (docs/transformation/03-gpui-feasibility.md).
gpui = { git = "https://github.com/zed-industries/zed", rev = "d31d1074a07b7bbaa43a52fef7847a00dd491baf" }
# GPUI's platform backends. Without the `wayland` and `x11` features the app starts with no window and no
# errors (headless mode): they must always be set.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d31d1074a07b7bbaa43a52fef7847a00dd491baf", features = ["wayland", "x11"] }
# Same semver line as `image` used by GPUI (0.25), so the `Frame`s we pass to `RenderImage` are
# of the same type; only the `Frame`/`RgbaImage` type is needed, no codec.
image = { version = "0.25", default-features = false }
# `RenderImage::new` takes a `SmallVec<[Frame; 1]>`.
smallvec = "1"

# `watch::Receiver::changed()` (the core's snapshots), `oneshot` (core shutdown, covers, opening
# of a video) and `Notify` (the video frame wake-up):
# channels that do not depend on the runtime, so GPUI's executor can await them. Only `sync`, no
# extra runtime: the core has its own. Already in the graph (core, client).
tokio = { version = "1", default-features = false, features = ["sync"] }
# Track ids in the interface caches (liked, downloaded): the same type as the core. `v4`
# for the id of a new playlist (`LibraryCmd::CreatePlaylist` wants it from whoever creates it): the core
# already switches it on, so no new crate.
uuid = { version = "1", features = ["v4"] }
# The frontends' preferences (`SettingsView::ui`, `SettingsCmd::SaveUiPrefs`) are a JSON map of the
# core: the desktop reads and writes «Riduci il movimento» there. Already in the graph (core, client), no new crate.
serde_json = "1"

# The video (only with the `video` feature): the pipeline (`uridecodebin`, `videoscale`, `appsink`) and the
# frames. The same 0.22 versions that the earlier client's video crate already brought into the graph: no
# new crate to compile (`gstreamer-video` is not needed: size and format are read from the caps).
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }

# Grapheme boundaries in the search field (arrows and deletion per visible character). It is the
# same crate GPUI uses: no new crate in the graph.
unicode-segmentation = "1"

[dev-dependencies]
# The core's test tracks (`api::models::fixtures`, behind the `test-support` feature, which brings no
# new crates). Only for tests.
psytify-core = { path = "../core", default-features = false, features = ["test-support"] }

[lints]
workspace = true
