<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Psytify">
  <title>Psytify</title>
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#c6f24e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6f24e" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#0b0b0b"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="640" width="640" height="320" fill="url(#fade)"/>
  <!-- marchio: tre barre lime -->
  <g fill="#c6f24e" transform="translate(120 70)">
    <rect x="0" y="92" width="34" height="76" rx="17"/>
    <rect x="46" y="52" width="34" height="116" rx="17"/>
    <rect x="92" y="8" width="34" height="160" rx="17"/>
  </g>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="290" y="168" fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-2">Psytify</text>
    <text x="294" y="214" fill="#b8b8b8" font-size="26" font-weight="400">A fast, lightweight desktop and Android music player, written in Rust.</text>
    <g transform="translate(294 244)" font-size="15" font-weight="600">
      <rect width="92" height="30" rx="15" fill="#1b1b1b" stroke="#2e2e2e"/>
      <text x="46" y="20" fill="#c6f24e" text-anchor="middle">Rust</text>
      <rect x="104" width="92" height="30" rx="15" fill="#1b1b1b" stroke="#2e2e2e"/>
      <text x="150" y="20" fill="#c6f24e" text-anchor="middle">Iced</text>
      <rect x="208" width="116" height="30" rx="15" fill="#1b1b1b" stroke="#2e2e2e"/>
      <text x="266" y="20" fill="#c6f24e" text-anchor="middle">Lossless</text>
      <rect x="336" width="104" height="30" rx="15" fill="#1b1b1b" stroke="#2e2e2e"/>
      <text x="388" y="20" fill="#c6f24e" text-anchor="middle">Android</text>
    </g>
  </g>
</svg>
